id: class-fields
message: Detected downlevel helpers for class fields
severity: info
language: javascript
rule:
  any:
    - pattern: function _classPrivateFieldGet($_, $_) { $$$ }
    - pattern: function _classPrivateFieldSet($_, $_, $_) { $$$ }
    - pattern: function _classPrivateFieldInitSpec($_, $_, $_) { $$$ }
    - pattern: function __classPrivateFieldGet($$$) { $$$ }
    - pattern: function __classPrivateFieldSet($$$) { $$$ }
    - pattern: require("@babel/runtime/helpers/classPrivateFieldGet")
    - pattern: import("@babel/runtime/helpers/classPrivateFieldGet")
    - pattern: require("@babel/runtime/helpers/classPrivateFieldSet")
    - pattern: import("@babel/runtime/helpers/classPrivateFieldSet")
    - pattern: require("@babel/runtime/helpers/classPrivateFieldInitSpec")
    - pattern: import("@babel/runtime/helpers/classPrivateFieldInitSpec")
    - pattern: 'function $FN($R, $E, $K, $F) { if ($K === "a" && !$F) throw new TypeError("Private accessor was defined without a getter"); $$$ }'
    - pattern: 'function $FN($R, $E, $A) { if (!$E.has($R)) throw new TypeError("attempted to " + $A + " private field on non-instance"); return $E.get($R); }'
